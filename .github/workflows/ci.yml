name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  # Linux on x86 and arm (Omarchy's machines), only for a v* tag (a release made on GitHub pushes
  # one). Pushes and PRs just test. Windows and macOS users can build it themselves.
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the version
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0" # a static binary, for any distro
        run: |
          version=$(git describe --tags --always --dirty)
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o tracklines-linux-${{ matrix.arch }} .
      - uses: actions/upload-artifact@v7
        with:
          name: tracklines-linux-${{ matrix.arch }}
          path: tracklines-linux-${{ matrix.arch }}

  # A v* tag publishes the binaries as a GitHub release. The release may already exist (made on GitHub,
  # which pushes the tag): then the binaries are added to it.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x tracklines-linux-*
          sha256sum tracklines-linux-* > SHA256SUMS
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" tracklines-linux-* SHA256SUMS --repo "${GITHUB_REPOSITORY}" --clobber

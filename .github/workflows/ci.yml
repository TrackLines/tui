name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      # known vulnerabilities our code actually reaches (PCI DSS 6.3.1)
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: go test ./...

  # Linux and macOS, each on x86 and arm, as four parallel jobs, only for a v* tag (a release made on
  # GitHub pushes one). Pushes and PRs just test. Windows users can build it themselves.
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the version
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0" # a static binary, for any distro (macOS cross-builds fine without cgo)
        run: |
          version=$(git describe --tags --always --dirty)
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o tracklines-${{ matrix.os }}-${{ matrix.arch }} ./cmd/tracklines
      - uses: actions/upload-artifact@v7
        with:
          name: tracklines-${{ matrix.os }}-${{ matrix.arch }}
          path: tracklines-${{ matrix.os }}-${{ matrix.arch }}

  # A v* tag publishes the binaries as a GitHub release. The release may already exist (made on GitHub,
  # which pushes the tag): then the binaries are added to it.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x tracklines-*-*
          sha256sum tracklines-*-* > SHA256SUMS
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" tracklines-*-* SHA256SUMS --repo "${GITHUB_REPOSITORY}" --clobber
